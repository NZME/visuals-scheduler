
name: Daily Draft

on:

  # MANUAL (GitHub UI): lets you click "Run workflow" from the GitHub
  # Actions tab to generate a draft at any time.
  workflow_dispatch:

  # SLASH COMMAND: fired by the Cloudflare Worker when someone types
  # /visuals-update in Slack. Triggers this same workflow instantly.
  repository_dispatch:
    types: [manual-draft-trigger]

jobs:
  post-draft:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pytz

      - name: Run daily draft
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          TEAMUP_API_KEY: ${{ secrets.TEAMUP_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          # Set on cron-job.org's 6:45pm repository_dispatch hit via
          # client_payload: {"source": "cron"} — empty for every other
          # trigger (manual workflow_dispatch, or the /visuals-update
          # tomorrow slash command, which sends no client_payload). Used by
          # acquire_daily_post_lock() in visuals_daily_draft.py to apply the
          # once-per-day dedupe lock only to the automated cron hit, not to
          # deliberate manual/Slack runs.
          TRIGGER_SOURCE: ${{ github.event.client_payload.source }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: python visuals_daily_draft.py
